<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internship Bot Dashboard</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 2rem; background: #0f1115; color: #e6e6e6; }
    a { color: #7fb3ff; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #333; font-size: 0.9rem; }
    th { color: #9aa; }
    .stats { display: flex; gap: 2rem; flex-wrap: wrap; margin: 1rem 0; }
    .stat-box { background: #1a1d24; border-radius: 8px; padding: 1rem 1.5rem; min-width: 160px; }
    .stat-box h3 { margin: 0 0 0.3rem 0; font-size: 0.85rem; color: #9aa; font-weight: normal; }
    .stat-box .value { font-size: 1.5rem; font-weight: bold; }
    pre { background: #1a1d24; padding: 1rem; overflow-x: auto; font-size: 0.8rem; }
    .status-0 { color: #e0b04a; }
    .status-1 { color: #4ade80; }
    .status-2 { color: #f87171; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Overview</a>
    <a href="/failed">Failed / Pending</a>
    <a href="/logs">Logs</a>
  </nav>
  <h1>{% block title %}Dashboard{% endblock %}</h1>
  {% block content %}{% endblock %}
</body>
</html>
